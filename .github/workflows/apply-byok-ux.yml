name: Apply BYOK UX integration

on:
  push:
    branches: [feature/byok-agent-ux-cleanup]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/byok-agent-ux-cleanup

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply guarded integration edits
        run: python3 .github/scripts/apply_byok_ux.py

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Commit verified integration
        run: |
          rm .github/scripts/apply_byok_ux.py .github/workflows/apply-byok-ux.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: streamline BYOK agent setup and persistence"
          git push origin HEAD:feature/byok-agent-ux-cleanup
