name: Public alpha audit fix

on:
  push:
    branches:
      - hardening/public-alpha-v0.1

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/public-alpha-v0.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh safe dependency versions within existing ranges
        run: npm audit fix --package-lock-only

      - name: Prove package manifest did not change
        run: git diff --exit-code -- package.json

      - name: Prove high-severity production audit is clean
        run: npm audit --omit=dev --audit-level=high

      - name: Commit lockfile refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already satisfies the audit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh audited transitive dependencies"
          git push origin HEAD:hardening/public-alpha-v0.1
